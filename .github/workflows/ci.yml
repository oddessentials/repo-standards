name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version Guard (PR only)
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking for manual version changes..."
          BASE_REF="origin/${{ github.base_ref }}"
          # Check if any version-controlled files have version line changes
          VERSION_FILES="package.json"
          for file in $VERSION_FILES; do
            if git diff "$BASE_REF"...HEAD -- "$file" | grep -E '^\+.*"version"' > /dev/null 2>&1; then
              echo "ERROR: Manual version change detected in $file"
              echo "Version is managed by semantic-release. Do not edit manually."
              exit 1
            fi
          done
          echo "No manual version changes detected"

      - name: CRLF Detection
        run: |
          echo "Checking for CRLF in shell scripts and source files..."
          if git ls-files --eol | grep -E 'w/crlf.*\.(sh|ts|js|mjs|cjs)$'; then
            echo "ERROR: CRLF line endings detected in script files"
            exit 1
          fi
          echo "Checking husky hooks for CRLF..."
          if git ls-files --eol .husky/ | grep 'w/crlf'; then
            echo "ERROR: CRLF line endings detected in husky hooks"
            exit 1
          fi
          echo "No CRLF issues found"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # v7 CI/Hook Parity: Run the same verify as pre-push hook
      - name: Verify (check + test + security + policy + build)
        run: npm run verify

      - name: Verify package entry point
        run: |
          npm pack --dry-run
          node -e "import('@oddessentials/repo-standards').then(m => console.log('Loaded:', Object.keys(m)))"

      - name: Deterministic build check
        run: |
          npm run build
          cp -r dist dist-first
          rm -rf dist
          npm run build
          diff -r dist-first dist || { echo "Build is not deterministic"; exit 1; }
